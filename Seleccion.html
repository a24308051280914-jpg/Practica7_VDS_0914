<!DOCTYPE html> <!-- Aqui empieza la pagina -->
<html lang="es"> <!-- El idioma que usa la pagina-->
<head> <!-- Configuracion de la pagina -->
<meta charset="UTF-8"> <!-- Sirve para utilizar letras y simbolos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- La pagina se adata a cualquier dispostivo -->
<title> Formularios en HTML</title> <!-- Titulo de la pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Libreria -->
</head> 
<body> <!-- Empieza lo que se ve en la pagina -->
<h1>Formularios</h1> <!-- Titulo de la pagina -->
<h2>Formularios con seleccion</h2> <!-- Subtitulo -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona tu pais:
<select name="pais">
<option value="1">Argentina</option> <!-- Lista de paises para elegir una sola opcion -->
<option value="2">España</option>
<option value="3">Mexico</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
</select>
<br>
<input type="submit" value="enviar"> <!-- Boton para mandar el formulario -->
<input type="reset" value="borrar"> <!-- Boton para borrar el formulario -->
</form>
</body> 
</html>
