<!DOCTYPE html> <!-- Aqui empieza la pagina -->
<html lang="es"> <!-- El idioma que usa la pagina-->
<head> <!-- Configuracion de la pagina -->
<meta charset="UTF-8"> <!-- Sirve para utilizar letras y simbolos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- La pagina se adapta a cualquier dispositivo -->
<title> Formularios en HTML</title> <!-- Titulo de la pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Libreria -->
</head> 
<body> <!-- Empieza lo que se ve en la pagina -->
<h1>Formularios</h1> <!-- Titulo de la pagina -->
<h2>Formulario con archivos</h2> <!-- Subtitulo de la pagina -->
<form action="" method="post"> 
Ingresa tu nombre: 
<input type="text" name="nombre"> 
<br> 
<input type="file" name="archivo"> <!-- Sirve para seleccionar un archivo -->
<br> 
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Boton para enviar el formulario -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Boton para borrar lo escrito -->
</form> <!-- Aqui termina el formulario -->
</body> <!-- Aqui termina lo que se ve en la pagina -->
</html> <!-- Aqui termina la pagina -->
