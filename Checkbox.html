<!DOCTYPE html> <!-- Aqui empieza la pagina -->

<title> Formularios en HTML</title> <!-- Titulo de la pestaña -->

<body> <!-- Empieza lo que se ve en la pagina -->
<h1>Formularios</h1> <!-- Titulo de la pagina -->
<h2>Formularios con checkbox</h2> <!-- Subtitulo -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona los lenguajes que conozcas:
<br>
<input type="checkbox" name="Java">Java<br> <!-- Opciones con botones para elegir -->
<input type="checkbox" name="Python"> Python<br>
<input type="checkbox" name="C#">C#<br>
<input type="checkbox" name="Flutter"> Flutter<br>
</form>
</body>
