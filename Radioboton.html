<!DOCTYPE html> <!-- Aqui empieza la pagina -->
<html lang="es"> <!-- El idioma que usa la pagina-->
<head> <!-- Configuracion de la pagina -->
<meta charset="UTF-8"> <!-- Sirve para utilizar letras y simbolos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- La pagina se adata a cualquier dispostivo -->
<title> Formularios en HTML</title> <!-- Titulo de la pestaña -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Libreria -->
</head> 
<body> <!-- Empieza lo que se ve en la pagina -->
<h1>Formularios</h1> <!-- Titulo de la pagina -->
<h2>Formularios con Radioboton</h2> <!-- Subtitulo -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona el maximo de estudios que tienes:
<br>
<input type="radio" name="estudios" value="1">Sin estudios <br> <!-- Opciones, de las cuales te deja elgir solo una -->
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>
</body> 
</html>
